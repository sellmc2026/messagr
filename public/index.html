<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link rel="icon" type="image/png" href="favicon.png">

    <title>Messagr - Simple Private Messaging</title>

    <meta
        name="description"
        content="Messagr is a simple private messaging website. Create a room, share the code, and start chatting."
    >

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: #ffffff;
            color: #111111;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* ========================================
           WELCOME
           ======================================== */

        .welcome {

            width: 90%;

            max-width: 430px;

            text-align: center;
        }


        /* ========================================
           LOGO
           ======================================== */

        .logo {

            font-size: 42px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        /* ========================================
           SUBTITLE
           ======================================== */

        .subtitle {

            font-size: 17px;

            color: #555555;

            line-height: 1.5;

            margin-bottom: 35px;
        }


        /* ========================================
           IDENTITY BOX
           ======================================== */

        .identityBox {

            border: 1px solid #dddddd;

            border-radius: 14px;

            padding: 25px;

            background: #fafafa;
        }


        /* ========================================
           TITLE
           ======================================== */

        .identityTitle {

            font-size: 20px;

            font-weight: 600;

            margin-bottom: 10px;
        }


        /* ========================================
           DESCRIPTION
           ======================================== */

        .identityText {

            font-size: 14px;

            color: #666666;

            line-height: 1.5;

            margin-bottom: 20px;
        }


        /* ========================================
           USERNAME INPUT
           ======================================== */

        .usernameInput {

            width: 100%;

            padding: 13px;

            background-color: #ffffff;

            color: #111111;

            border: 1px solid #dddddd;

            border-radius: 9px;

            font-size: 16px;

            text-align: center;

            outline: none;

            margin-bottom: 10px;
        }


        .usernameInput:focus {

            border-color: #111111;
        }


        /* ========================================
           CONTINUE BUTTON
           ======================================== */

        .continueButton {

            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: 1px solid #dddddd;

            border-radius: 9px;

            background: #ffffff;

            color: #111111;

            font-size: 15px;

            cursor: pointer;
        }


        .continueButton:hover {

            background: #f2f2f2;
        }


        /* ========================================
           WARNING
           ======================================== */

        .warning {

            font-size: 12px;

            color: #777777;

            margin-top: 18px;

            line-height: 1.4;
        }

    </style>

</head>


<body>


    <main class="welcome">


        <!-- ========================================
             LOGO
             ======================================== -->

        <div class="logo">

            Messagr

        </div>


        <!-- ========================================
             SUBTITLE
             ======================================== -->

        <div class="subtitle">

            Simple messaging without the unnecessary stuff.

        </div>


        <!-- ========================================
             IDENTITY BOX
             ======================================== -->

        <div class="identityBox">


            <div class="identityTitle">

                Welcome to Messagr 👋

            </div>


            <div class="identityText">

                Choose a username to use when messaging.

            </div>


            <!-- ========================================
                 USERNAME
                 ======================================== -->

            <input
                class="usernameInput"
                id="welcomeUsername"
                type="text"
                placeholder="Choose a username"
                maxlength="8"
                autocomplete="off"
            >


            <!-- ========================================
                 CONTINUE
                 ======================================== -->

            <button
                class="continueButton"
                id="continueButton"
            >

                Continue

            </button>


            <!-- ========================================
                 WARNING
                 ======================================== -->

            <div class="warning">

                Your username can be changed later.

            </div>


        </div>


    </main>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script>

    /* ========================================
       CHECK IF WELCOME SCREEN WAS COMPLETED
       ======================================== */

    if (
        localStorage.getItem(
            "messagrWelcomeCompleted"
        ) === "true"
    ) {

        window.location.href =
            "messagr.html";

    }


    /* ========================================
       USERNAME
       ======================================== */

    const welcomeUsername =
        document.getElementById("welcomeUsername");

    const continueButton =
        document.getElementById("continueButton");


    /* Load saved username */

    const savedUsername =
        localStorage.getItem("messagrUsername");


    if (savedUsername) {

        welcomeUsername.value =
            savedUsername;

    }


    /* ========================================
       CONTINUE BUTTON
       ======================================== */

    continueButton.addEventListener(
        "click",
        () => {

            const username =
                welcomeUsername.value.trim();


            if (!username) {

                alert(
                    "Please choose a username."
                );

                return;

            }


            if (username.length > 8) {

                alert(
                    "Username must be 8 characters or less."
                );

                return;

            }


            /* Save username */

            localStorage.setItem(
                "messagrUsername",
                username
            );


            /* Mark welcome screen as completed */

            localStorage.setItem(
                "messagrWelcomeCompleted",
                "true"
            );


            /* Go to main Messagr page */

            window.location.href =
                "messagr.html";

        }
    );


    /* ========================================
       ENTER KEY
       ======================================== */

    welcomeUsername.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {

                continueButton.click();

            }

        }
    );

</script>


</body>

</html>
